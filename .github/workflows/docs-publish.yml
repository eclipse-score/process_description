name: Documentation Publish

on:
  workflow_run:
    workflows: ["Documentation"]
    types: [completed]

jobs:
  docs-publish:
    if: github.event.workflow_run.conclusion == 'success'
    uses: eclipse-score/cicd-workflows/.github/workflows/docs-publish.yml@972e0bd6ce2e41bd627635d3355e8c56efb99530 # 2026-11-13
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
      pull-requests: write
